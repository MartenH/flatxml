name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its previous run; every commit on main is verified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# V3 retries a program it cannot build with a downloaded older compiler unless told not to, which
# would let a V3 regression pass unseen (the variable is read on every platform, despite its
# name). V uploads a source excerpt on a C compilation error unless reporting is disabled.
env:
  V_MACOS_V3_NO_FALLBACK: 1
  V_C_ERROR_BUG_REPORT_DISABLED: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pinned V
        uses: ./.github/actions/setup-v

      - name: Unit tests
        run: v test .

      - name: The README's examples type-check
        run: scripts/check_readme_examples.sh

      - name: Build the tools
        run: |
          mkdir -p bin
          v -o bin/flatxml cmd/cli
          v -prod -o bin/genxml cmd/genxml

      - name: Identical to expat
        run: |
          ./bin/genxml "$RUNNER_TEMP/gen_8.xml" 8
          tools/check_vs_expat.py bin/flatxml testdata "$RUNNER_TEMP/gen_8.xml"
          tools/check_vs_expat.py --ns bin/flatxml testdata "$RUNNER_TEMP/gen_8.xml"

      - name: Written back, each document is itself
        run: |
          bin/flatxml roundtrip testdata "$RUNNER_TEMP/gen_8.xml"
          bin/flatxml roundtrip --nodes testdata "$RUNNER_TEMP/gen_8.xml"
          bin/flatxml roundtrip --rewrite testdata "$RUNNER_TEMP/gen_8.xml"

      - name: Edits from the command line
        run: |
          printf 'attr\t/\tk\tv\ninsert\t/\t0\t<n/>\nmove\t/1\t0\t/0\n' | bin/flatxml edit testdata/tricky.xml "$RUNNER_TEMP/edited.xml" -
          bin/flatxml roundtrip "$RUNNER_TEMP/edited.xml"
          if printf 'insert\t/abc\t0\t<z/>\n' | bin/flatxml edit testdata/tricky.xml - -; then exit 1; fi

      - name: A diff applied gives the new document
        run: bin/flatxml apply --check testdata/tricky.xml "$RUNNER_TEMP/edited.xml" "$RUNNER_TEMP/applied.xml"

      - name: A three-way merge takes both sides
        run: bin/flatxml merge3 testdata/tricky.xml "$RUNNER_TEMP/edited.xml" testdata/tricky.xml "$RUNNER_TEMP/merged.xml"

      - name: A generated document is valid against its schema
        run: bin/flatxml validate testdata/inventory.xsd "$RUNNER_TEMP/gen_8.xml"

      - name: Mutation fuzzing against expat
        run: |
          tools/fuzz_vs_expat.py --count 500 --seed 1 --keep "$RUNNER_TEMP/fuzz" bin/flatxml testdata/tricky.xml testdata/namespaces.xml
          tools/fuzz_vs_expat.py --ns --count 500 --seed 2 --keep "$RUNNER_TEMP/fuzz" bin/flatxml testdata/tricky.xml testdata/namespaces.xml

      - name: W3C XML Schema test suite
        run: |
          scripts/fetch_xsts.sh "$RUNNER_TEMP/xsts"
          tools/xsts.py bin/flatxml "$RUNNER_TEMP/xsts"

      - name: Keep the failing fuzz cases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: ${{ runner.temp }}/fuzz
          if-no-files-found: ignore
